<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="你的英语知识书、学习档案与对话课堂。">
  <title>English Book</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/learning.css">
  <link rel="stylesheet" href="/topics.css">
  <script defer src="/app.js"></script>
  <script defer src="/learning.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#"><span class="brand-mark">E</span><span><strong>English Book</strong><small>A personal reading practice</small></span></a>
    <input id="search" type="search" aria-label="搜索知识书" placeholder="搜索词组、知识点或章节…">
    <button id="theme" aria-label="切换深浅主题">切换主题</button>
  </header>
  <div class="shell">
    <aside class="sidebar"><nav class="work-nav" aria-label="学习工作台"><a href="#topics">主页</a><a href="#reviews">今日复习 <span id="due-count"></span></a></nav><div class="nav-heading">目录 <button id="refresh" title="读取最新教材">刷新</button></div><nav id="nav" aria-label="知识目录"></nav><div class="reference-tools"><span>查阅与整理</span><a href="#dictionary">查词典</a><a href="#library">词表资料库</a><a href="#import">录入词句</a></div><p class="sidebar-note">每章解决一个阅读难点。<br>学到需要的地方，再查词与复习。</p></aside>
    <main id="main">
      <div class="reading-top"><span id="breadcrumb">学习起点</span><span class="reading-actions"><button id="dict-selection">查选中词</button></span></div>
      <article id="article" class="prose"><p>正在打开知识书…</p></article>
      <section id="chapter-learning"></section>
      <footer id="source"></footer>
    </main>
  </div>
  <div id="notice" role="status" hidden></div>
</body>
</html>
