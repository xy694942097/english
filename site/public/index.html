<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="你的英语知识书：Markdown 阅读、编辑与关键词搜索。">
  <title>English Book</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/vendor/github-dark.min.css">
  <script defer src="/vendor/marked.min.js"></script>
  <script defer src="/vendor/highlight.min.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#"><span class="brand-mark">E</span><span><strong>English Book</strong><small>A personal reading practice</small></span></a>
    <input id="search" type="search" aria-label="搜索知识书" placeholder="搜索词组、知识点或章节…">
    <button id="theme" aria-label="切换深浅主题">切换主题</button>
  </header>
  <div class="shell">
    <aside class="sidebar">
      <div class="nav-heading">目录</div>
      <nav id="nav" aria-label="知识目录"></nav>
    </aside>
    <main id="main">
      <div class="reading-top"><span id="breadcrumb">学习起点</span><div class="reading-actions"><button id="edit-document" type="button" hidden>编辑本文</button><div id="edit-actions" class="edit-actions" hidden><span id="edit-status" role="status"></span><button id="cancel-edit" type="button">取消</button><button id="save-edit" type="button" class="primary" disabled>保存修改</button></div></div></div>
      <p id="section-edit-tip" class="section-edit-tip" hidden>这篇文档较长。点击标有“编辑本节”的小节标题，只编辑该节，其他内容保持原样。</p>
      <article id="article" class="prose"><p>正在打开知识书…</p></article>
      <section id="edit-panel" class="edit-panel" aria-label="Markdown 编辑器" hidden>
        <div id="markdown-editor"></div>
        <p class="edit-hint">直接在正文中编辑；底部可切换 Markdown 源码，保存前可检查复杂排版。</p>
      </section>
      <footer id="source"></footer>
    </main>
    <aside id="outline" class="outline" aria-label="本篇目录" hidden>
      <div class="outline-head"><strong>本篇目录</strong></div>
      <nav id="outline-links" aria-label="文章小节"></nav>
    </aside>
  </div>
  <button id="left-toggle" class="edge-toggle" type="button" aria-controls="nav" aria-expanded="true" aria-label="收起左侧导航" data-tip="收起左侧导航">‹</button>
  <button id="right-toggle" class="edge-toggle" type="button" aria-controls="outline" aria-expanded="false" aria-label="展开目录" data-tip="展开目录" hidden>☷</button>
</body>
</html>
